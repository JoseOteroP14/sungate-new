name: Refresh solar GHI

on:
  schedule:
    # 00:17 America/Bogota on the 1st and 16th (~every 15 days)
    - cron: "17 5 1,16 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: solar-ghi-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Update GHI grid
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch Open-Meteo archive GHI
        run: bun run solar:ghi

      - name: Commit grid if it changed
        id: commit
        run: |
          git add data/solar/ghi-grid.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "GHI grid unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$(cat <<'EOF'
          Refresh rooftop GHI grid from the Open-Meteo archive.

          EOF
          )"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy painted tiles
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
